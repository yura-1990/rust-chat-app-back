[package]
name = "gateway"
version = "0.1.0"
edition.workspace = true

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
chat-proto = { path = "../proto" }
async-nats = "0.53.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "migrate"] }
chat-common = { version = "0.1.0", path = "../common" }
chat-auth = { version = "0.1.0", path = "../auth" }
chat-service = { version = "0.1.0", path = "../chat" }
serde = { version = "1.0.229", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
