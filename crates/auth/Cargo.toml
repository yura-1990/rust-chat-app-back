[package]
name = "chat-auth"
version = "0.1.0"
edition.workspace = true

[dependencies]
argon2 = "0.6.0"
chat-common = { path = "../common" }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "macros"] }
thiserror = "2.0.21"
